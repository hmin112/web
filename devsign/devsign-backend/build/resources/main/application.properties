spring.application.name=devsign-backend

# DATABASE - 도커 환경에 맞춰 수정됨
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# localhost를 db로 변경, 데이터베이스 명을 devsigndb로 변경
spring.datasource.url=jdbc:mysql://db:3306/devsigndb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&zeroDateTimeBehavior=convertToNull&rewriteBatchedStatements=true
# docker-compose.yml에 설정한 사용자 정보와 일치시킴
spring.datasource.username=devsignuser
spring.datasource.password=devsign4122

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# JWT 설정
jwt.secret=devsign-club-secret-key-for-jwt-token-generation-minimum-256-bits-required-for-hs256
jwt.expiration=3600000

# SERVER
server.port=${PORT:8080}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB

# Upload Storage Base Directory
app.upload.base-dir=${APP_UPLOAD_BASE_DIR:uploads}

# 성능 최적화 설정
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# 파일 업로드/다운로드 속도 및 용량 제한
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# 성능 최적화 설정
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# 파일 업로드 용량 제한 늘리기
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
